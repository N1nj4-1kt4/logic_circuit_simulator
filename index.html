<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Circuit Simulator</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Logic Circuit Simulator</h1>
        </header>

        <div class="main-content">
            <!-- Toolbar -->
            <div class="toolbar">
                <div class="tool-section">
                    <h4>Logic Gates</h4>
                    <div class="gate-grid">
                        <button class="tool-btn gate-btn" data-type="AND">
                            <svg width="40" height="30" viewBox="0 0 50 40">
                                <path d="M 10 10 L 25 10 A 15 15 0 0 1 25 30 L 10 30 Z" fill="currentColor"/>
                            </svg>
                            <span>AND</span>
                        </button>
                        <button class="tool-btn gate-btn" data-type="OR">
                            <svg width="40" height="30" viewBox="0 0 50 40">
                                <path d="M 10 10 Q 20 20 10 30 Q 25 25 40 20 Q 25 15 10 10" fill="currentColor"/>
                            </svg>
                            <span>OR</span>
                        </button>
                        <button class="tool-btn gate-btn" data-type="NOT">
                            <svg width="40" height="30" viewBox="0 0 50 40">
                                <path d="M 10 12 L 10 28 L 35 20 Z" fill="currentColor"/>
                                <circle cx="38" cy="20" r="3" fill="currentColor"/>
                            </svg>
                            <span>NOT</span>
                        </button>
                        <button class="tool-btn gate-btn" data-type="XOR">
                            <svg width="40" height="30" viewBox="0 0 50 40">
                                <path d="M 10 10 Q 20 20 10 30 Q 25 25 40 20 Q 25 15 10 10" fill="currentColor"/>
                                <path d="M 5 10 Q 15 20 5 30" fill="none" stroke="currentColor" stroke-width="2"/>
                            </svg>
                            <span>XOR</span>
                        </button>
                        <button class="tool-btn gate-btn" data-type="NAND">
                            <svg width="40" height="30" viewBox="0 0 50 40">
                                <path d="M 10 10 L 25 10 A 15 15 0 0 1 25 30 L 10 30 Z" fill="currentColor"/>
                                <circle cx="43" cy="20" r="3" fill="currentColor"/>
                            </svg>
                            <span>NAND</span>
                        </button>
                        <button class="tool-btn gate-btn" data-type="NOR">
                            <svg width="40" height="30" viewBox="0 0 50 40">
                                <path d="M 10 10 Q 20 20 10 30 Q 25 25 37 20 Q 25 15 10 10" fill="currentColor"/>
                                <circle cx="43" cy="20" r="3" fill="currentColor"/>
                            </svg>
                            <span>NOR</span>
                        </button>
                        <button class="tool-btn gate-btn" data-type="XNOR">
                            <svg width="40" height="30" viewBox="0 0 50 40">
                                <path d="M 10 10 Q 20 20 10 30 Q 25 25 37 20 Q 25 15 10 10" fill="currentColor"/>
                                <path d="M 5 10 Q 15 20 5 30" fill="none" stroke="currentColor" stroke-width="2"/>
                                <circle cx="43" cy="20" r="3" fill="currentColor"/>
                            </svg>
                            <span>XNOR</span>
                        </button>
                    </div>
                </div>

                <div class="tool-section">
                    <h4>I/O Components</h4>
                    <div class="io-grid">
                        <button class="tool-btn" data-type="INPUT">
                            <span class="icon-lg">○</span>
                            <span>Input</span>
                        </button>
                        <button class="tool-btn" data-type="OUTPUT">
                            <span class="icon-lg">◉</span>
                            <span>Output</span>
                        </button>
                    </div>
                </div>

                <div class="tool-section hidden" id="customComponentsSection">
                    <h4>Custom Components</h4>
                    <select id="customComponentsDropdown" class="custom-dropdown">
                        <option value="">Select a component...</option>
                    </select>
                </div>

                <div class="tool-section">
                    <h4>Actions</h4>
                    <button class="action-btn" id="connectMode">Connect Mode</button>
                    <button class="action-btn" id="deleteMode">Delete Mode</button>
                    <button class="action-btn" id="clearBoard">Clear Board</button>
                </div>

                <div class="tool-section">
                    <h4>Simulation Controls</h4>
                    <button class="action-btn" id="simulate">▶ Simulation</button>
                    <div class="simulation-stepper">
                        <button class="step-btn" id="prevStep" title="Previous input combination" aria-label="Previous">
                            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 4L6 10L12 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <span>Prev</span>
                        </button>
                        <button class="step-btn" id="nextStep" title="Next input combination" aria-label="Next">
                            <span>Next</span>
                            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M8 4L14 10L8 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                    <button class="action-btn" id="resetSim">Reset</button>
                    <button class="action-btn" id="truthTable">📊 Truth Table</button>
                </div>

                <div class="tool-section">
                    <h4>Board Management</h4>
                    <button class="action-btn" id="newBoard">📋 New Board</button>
                    <button class="action-btn" id="saveBoard">💾 Save Board</button>
                    <button class="action-btn" id="revertToSaved" disabled>↩️ Revert to Saved</button>
                    <div id="savedBoardsSection" class="hidden mt-8">
                        <label class="label-sm">Load Board:</label>
                        <select id="savedBoardsDropdown" class="custom-dropdown">
                            <option value="">Select a board...</option>
                        </select>
                    </div>
                </div>

                <div class="tool-section">
                    <h4>Component Library</h4>
                    <button class="action-btn" id="saveComponent">Save as Component</button>
                    <button class="action-btn" id="manageComponents">Manage Library</button>
                    <button class="action-btn" id="exportComponent">Export Component</button>
                    <button class="action-btn" id="importComponent">Import Component</button>
                    <input type="file" id="importFile" accept=".json" class="hidden" />
                </div>
            </div>

            <!-- Breadboard Canvas -->
            <div class="canvas-container">
                <div class="canvas-header">
                    <span id="currentCircuitName" class="circuit-name">Unsaved Board</span>
                    <div class="header-buttons">
                        <button class="header-btn theme-toggle" id="themeToggle" title="Toggle Dark Mode">🌙</button>
                        <button class="header-btn help-btn" id="helpBtn" title="Help (?)">?</button>
                    </div>
                </div>
                <canvas id="breadboard" width="1400" height="800"></canvas>
                <div class="canvas-footer">
                    <span id="modeIndicator">Mode: Neutral</span>
                    <span id="selectedComponent"></span>
                </div>
            </div>

            <!-- Truth Table Panel -->
            <div id="truthTablePanel" class="truth-table-panel hidden">
                <div class="panel-header">
                    <h3>Truth Table</h3>
                    <button id="closeTruthTable">Close</button>
                </div>
                <div id="truthTableContent"></div>
            </div>

                </div>
                <div class="dialog-content">
                    <div class="form-group">
                        <label for="boardNameInput">Board Name:</label>

        </div>
    </div>
